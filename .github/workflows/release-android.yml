name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve release version
        id: release
        run: |
          package_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          test -n "$package_version"
          if test "$GITHUB_REF_TYPE" = 'tag'; then
            version="${GITHUB_REF_NAME#v}"
            test "$version" = "$package_version"
          else
            version="$package_version"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/yotsuba-release.jks
          chmod 600 android/app/yotsuba-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$ANDROID_STORE_PASSWORD" \
            "$ANDROID_KEY_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            'yotsuba-release.jks' \
            > android/key.properties
          chmod 600 android/key.properties

      - name: Verify source
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze lib test
          flutter test

      - name: Build signed universal APK
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          flutter build apk --release --build-name="$RELEASE_VERSION" --build-number="$GITHUB_RUN_NUMBER"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Yotsuba-Schedule-Android-${RELEASE_VERSION}.apk"

      - name: Verify signature and checksum
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          apk="dist/Yotsuba-Schedule-Android-${RELEASE_VERSION}.apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$build_tools/apksigner"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          cd dist
          sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: yotsuba-schedule-android-${{ steps.release.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          notes="docs/releases/v${RELEASE_VERSION}.md"
          if test -f "$notes"; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "Yotsuba Schedule ${GITHUB_REF_NAME}" \
              --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "Yotsuba Schedule ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
